version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app   # also persists the SQLite db file (feature_flag.db) on the host
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
